<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'">
<meta name="description" content="Pro Note: a fast, private, offline-capable notebook with sections and pages.">
<meta name="theme-color" content="#7719aa">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%237719aa'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E">
<title>Pro Note</title>
<style>
  :root { --brand:#7719aa; --bg:#fff; --fg:#242424; --muted:#6b6b6b; --ribbon:#faf9f8; --nav:#f3f2f1; --line:#e1dfdd;
          --hover:#edebe9; --sel:#e8d9f1; --rule:#e6eef8; --danger:#c42b1c; color-scheme: light; }
  :root[data-theme="dark"] { --brand:#c58be8; --bg:#1f1f1f; --fg:#f0f0f0; --muted:#a8a8a8; --ribbon:#2b2b2b; --nav:#262626;
          --line:#404040; --hover:#383838; --sel:#4a2a5c; --rule:#2d3440; --danger:#ff6b5e; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .skip { position: absolute; left: -999px; top: 0; background: #fff; color: #000; padding: 8px; z-index: 99; }
  .skip:focus { left: 8px; top: 8px; }

  #title { display: flex; align-items: center; gap: 14px; padding: 6px 12px; background: #7719aa; color: #fff; }
  #title .logo { font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  #title .logo i { background: #fff; color: #7719aa; width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; font-style: normal; font-weight: 800; }
  #search { flex: 0 1 380px; margin: 0 auto; padding: 5px 12px; border-radius: 6px; border: 0; background: rgba(255,255,255,.22); color: #fff; }
  #search::placeholder { color: rgba(255,255,255,.9); }
  #search:focus { background: #fff; color: #242424; outline: 2px solid #fff; }
  #saved { font-size: 12px; min-width: 76px; text-align: right; }

  #ribbon { display: flex; gap: 0; padding: 6px 8px; background: var(--ribbon); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .group { display: flex; flex-direction: column; justify-content: space-between; padding: 0 10px; border-right: 1px solid var(--line); }
  .group:last-child { border-right: 0; }
  .row { display: flex; gap: 2px; align-items: center; min-height: 30px; }
  .glabel { font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }
  .rb { min-width: 30px; height: 30px; padding: 0 8px; border: 1px solid transparent; background: transparent; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .rb:hover { background: var(--hover); }
  .rb.wide { padding: 0 10px; }
  .rb.primary { background: var(--brand); color: #fff; } :root[data-theme="dark"] .rb.primary { color: #1f1f1f; }
  .rb.danger { background: var(--danger); color: #fff; }
  select.rb { background: var(--bg); border-color: var(--line); height: 28px; }
  input[type=color] { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); background: none; border-radius: 4px; }

  #app { flex: 1; display: grid; grid-template-columns: 210px 250px 1fr; min-height: 0; }
  #nav { background: var(--nav); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 0; }
  #pages { border-right: 1px solid var(--line); overflow-y: auto; }
  .nbname { padding: 8px 16px 12px; font-weight: 600; }
  .sec, .pg { display: flex; align-items: center; gap: 4px; position: relative; border-left: 3px solid transparent; }
  .sec:hover, .pg:hover { background: var(--hover); }
  .sec.active, .pg.active { background: var(--sel); border-left-color: var(--sec, var(--brand)); }
  .main { flex: 1; min-width: 0; text-align: left; border: 0; background: none; cursor: pointer; padding: 9px 8px; }
  .sec .main { padding-left: 4px; } .sec.active .main { font-weight: 600; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 0; margin-left: 11px; cursor: pointer; flex: none; padding: 0; }
  .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { opacity: 0; border: 0; background: none; cursor: pointer; color: var(--muted); border-radius: 4px; width: 26px; height: 26px; margin-right: 6px; }
  .sec:hover .x, .pg:hover .x, .x:focus-visible { opacity: 1; }
  .x:hover { background: var(--hover); color: var(--fg); }
  .addbtn { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 16px; cursor: pointer; color: var(--brand); font-weight: 600; }
  .addbtn:hover { background: var(--hover); }
  .hint { padding: 16px; color: var(--muted); }

  #canvasWrap { overflow-y: auto; }
  #canvas { max-width: 900px; margin: 0 auto; padding: 28px 40px 80px; }
  #ptitle { width: 100%; border: 0; background: transparent; font: 300 32px/1.2 "Segoe UI Light", "Segoe UI", system-ui, sans-serif; color: var(--fg); }
  #ptitle:focus-visible { outline: 0; }
  #pdate { color: var(--muted); font-size: 12px; padding: 6px 0 10px; border-bottom: 2px solid var(--sec, var(--brand)); margin-bottom: 14px; }
  #body { --fs: 16px; font-size: var(--fs); line-height: 1.8; outline: 0; min-height: 60vh; overflow-wrap: anywhere; }
  #body:empty::before { content: "Start typing…"; color: var(--muted); }
  body.ruled #body { background-image: linear-gradient(to bottom, transparent calc(100% - 1px), var(--rule) 0); background-size: 100% 1.8em; }
  #body h1 { font-size: 1.9em; margin: .2em 0; font-weight: 600; line-height: 1.3; }
  #body h2 { font-size: 1.4em; margin: .2em 0; font-weight: 600; line-height: 1.3; }
  #body h3 { font-size: 1.15em; margin: .2em 0; font-weight: 600; line-height: 1.3; }
  #body p { margin: 0; }
  #body table { border-collapse: collapse; margin: 8px 0; }
  #body td, #body th { border: 1px solid var(--line); min-width: 90px; padding: 6px 10px; line-height: 1.4; }
  #body a { color: var(--brand); }
  #body hr { border: 0; border-top: 1px solid var(--line); }
  #body .todo input { margin-right: 8px; accent-color: var(--brand); transform: scale(1.15); }

  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 20px; width: min(420px, 92vw); background: var(--bg); color: var(--fg); box-shadow: 0 12px 40px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 8px; font-size: 17px; }
  dialog p { margin: 0 0 12px; color: var(--muted); }
  #dInput { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); margin-bottom: 12px; }
  .dbtns { display: flex; justify-content: flex-end; gap: 8px; }
  .dbtns .rb { border-color: var(--line); height: 32px; padding: 0 16px; }
  .dbtns .rb.primary, .dbtns .rb.danger { border-color: transparent; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #323130; color: #fff; padding: 10px 16px; border-radius: 8px;
           display: none; gap: 14px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.35); z-index: 50; max-width: 92vw; }
  #toast.show { display: flex; }
  #toast button { background: none; border: 0; color: #d9b3ee; font-weight: 600; cursor: pointer; }

  @media (max-width: 800px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    #nav, #pages { display: flex; overflow-x: auto; overflow-y: hidden; padding: 0; border-right: 0; border-bottom: 1px solid var(--line); }
    .nbname { display: none; } .sec, .pg { flex: none; } .x { opacity: 1; } #canvas { padding: 18px 16px 60px; }
  }
  @media print {
    #title, #ribbon, #nav, #pages, #toast, .skip { display: none !important; }
    #app { display: block; } #canvasWrap { overflow: visible; } body { background: #fff; color: #000; }
    body.ruled #body { background: none; } #canvas { padding: 0; max-width: none; }
  }
</style>
</head>
<body>
<a class="skip" href="#body">Skip to note</a>

<header id="title">
  <div class="logo"><i aria-hidden="true">N</i> Pro Note</div>
  <input id="search" type="search" placeholder="Search all notes (Ctrl+E)" aria-label="Search all notes" autocomplete="off">
  <div id="saved" role="status" aria-live="polite">Saved</div>
</header>

<div id="ribbon" role="toolbar" aria-label="Formatting">
  <div class="group"><div class="row">
    <button class="rb wide" id="bNewPage" title="New page (Ctrl+Alt+N)">＋ New Page</button>
    <button class="rb wide" id="bImport" title="Import .txt, .md or .html">Import</button>
    <button class="rb wide" id="bExport" title="Download this page as HTML">Export</button>
    <input type="file" id="file" accept=".txt,.md,.html,.htm" multiple hidden>
  </div><div class="glabel">Page</div></div>

  <div class="group"><div class="row">
    <button class="rb" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
    <button class="rb" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
    <button class="rb" data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
    <button class="rb" data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
    <button class="rb" id="bHi" title="Highlight" aria-label="Highlight"><span style="background:#fff176;color:#000;padding:0 4px;border-radius:2px">ab</span></button>
    <input type="color" id="fcolor" value="#c00000" title="Font color" aria-label="Font color">
    <button class="rb" data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting">Tx</button>
  </div><div class="row">
    <button class="rb" data-cmd="insertUnorderedList" title="Bullets">• List</button>
    <button class="rb" data-cmd="insertOrderedList" title="Numbering">1. List</button>
    <button class="rb" data-cmd="outdent" title="Outdent" aria-label="Outdent">⇤</button>
    <button class="rb" data-cmd="indent" title="Indent" aria-label="Indent">⇥</button>
  </div><div class="glabel">Basic Text</div></div>

  <div class="group"><div class="row">
    <select class="rb" id="style" aria-label="Paragraph style"><option value="p">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option></select>
    <select class="rb" id="size" aria-label="Font size"><option value="2">Small</option><option value="3" selected>Medium</option><option value="4">Large</option><option value="5">X-Large</option></select>
  </div><div class="glabel">Styles</div></div>

  <div class="group"><div class="row">
    <button class="rb wide" id="tTodo" title="To Do (Ctrl+1)">☑ To Do</button>
    <button class="rb wide" id="tImp">★ Important</button>
    <button class="rb wide" id="tQ">? Question</button>
  </div><div class="glabel">Tags</div></div>

  <div class="group"><div class="row">
    <button class="rb wide" id="iTable">▦ Table</button>
    <button class="rb wide" id="iLink" title="Link (Ctrl+K)">🔗 Link</button>
    <button class="rb wide" id="iDate">📅 Date</button>
    <button class="rb wide" id="iHr">― Line</button>
  </div><div class="glabel">Insert</div></div>

  <div class="group"><div class="row">
    <button class="rb wide" id="bBackup" title="Download all notes as JSON">⬇ Backup</button>
    <button class="rb wide" id="bRestore" title="Replace all notes from a backup">⬆ Restore</button>
    <button class="rb wide" id="bPrint">🖨 Print</button>
    <input type="file" id="rfile" accept=".json,application/json" hidden>
  </div><div class="glabel">Notebook</div></div>

  <div class="group"><div class="row">
    <button class="rb wide" id="vTheme">Dark</button>
    <button class="rb wide" id="vRule" aria-pressed="false">Rule Lines</button>
    <button class="rb" id="zOut" title="Zoom out" aria-label="Zoom out">A−</button>
    <button class="rb" id="zIn" title="Zoom in" aria-label="Zoom in">A+</button>
  </div><div class="glabel">View</div></div>
</div>

<main id="app">
  <nav id="nav" aria-label="Sections"></nav>
  <div id="pages" role="list" aria-label="Pages"></div>
  <div id="canvasWrap">
    <div id="canvas">
      <input id="ptitle" maxlength="200" placeholder="Untitled page" aria-label="Page title" autocomplete="off">
      <div id="pdate"></div>
      <div id="body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Page content" spellcheck="true"></div>
    </div>
  </div>
</main>

<dialog id="dlg" aria-labelledby="dTitle">
  <h2 id="dTitle"></h2><p id="dMsg"></p>
  <input id="dInput" aria-labelledby="dTitle" autocomplete="off">
  <div class="dbtns"><button class="rb" id="dCancel">Cancel</button><button class="rb primary" id="dOk">OK</button></div>
</dialog>
<div id="toast" role="status" aria-live="polite"><span id="tMsg"></span><button id="tAct" hidden></button></div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const KEY = 'pronote:v2', OLD_KEY = 'pronote:onenote:v1';
  const COLORS = ['#7719aa', '#0078d4', '#107c10', '#d83b01', '#c239b3', '#038387', '#e3008c', '#ca5010'];
  const MAX_IMPORT = 2 * 1024 * 1024;
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const h = (tag, props = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) k.startsWith('on') ? (e[k] = v) : k === 'class' ? (e.className = v) : e.setAttribute(k, v);
    e.append(...kids); return e;
  };
  const body = $('body'), ptitle = $('ptitle');
  let S = null, savedRange = null, timer = null, dirty = false, warnedQuota = false;

  // ---------- sanitizer (allow-list) ----------
  const TAGS = new Set('P DIV BR B STRONG I EM U S STRIKE SPAN FONT H1 H2 H3 UL OL LI A TABLE TBODY TR TD TH HR INPUT BLOCKQUOTE'.split(' '));
  const DROP = new Set('SCRIPT STYLE IFRAME OBJECT EMBED LINK META SVG MATH FORM TEMPLATE NOSCRIPT TITLE HEAD BUTTON TEXTAREA SELECT IMG VIDEO AUDIO'.split(' '));
  const CSS_OK = new Set(['color', 'background-color', 'font-size', 'font-weight', 'font-style', 'text-decoration', 'text-decoration-line']);
  const safeUrl = u => /^(https?:|mailto:)/i.test(u.trim());
  function clean(html) {
    const doc = new DOMParser().parseFromString(String(html), 'text/html');
    (function walk(node) {
      for (const c of [...node.childNodes]) {
        if (c.nodeType === 3) continue;
        if (c.nodeType !== 1) { c.remove(); continue; }
        if (DROP.has(c.tagName)) { c.remove(); continue; }
        walk(c);
        if (!TAGS.has(c.tagName)) { c.replaceWith(...c.childNodes); continue; }
        const tag = c.tagName, keep = {};
        if (tag === 'A' && c.hasAttribute('href') && safeUrl(c.getAttribute('href'))) keep.href = c.getAttribute('href');
        if (tag === 'INPUT') { if (c.type !== 'checkbox') { c.remove(); continue; } keep.type = 'checkbox'; if (c.hasAttribute('checked')) keep.checked = ''; }
        if (tag === 'DIV' && c.classList.contains('todo')) keep.class = 'todo';
        if (tag === 'FONT') ['color', 'size'].forEach(a => c.hasAttribute(a) && (keep[a] = c.getAttribute(a)));
        if (tag === 'TD' || tag === 'TH') ['colspan', 'rowspan'].forEach(a => /^\d{1,2}$/.test(c.getAttribute(a) || '') && (keep[a] = c.getAttribute(a)));
        const css = [...c.style].filter(p => CSS_OK.has(p) && !/url\(|expression/i.test(c.style.getPropertyValue(p)))
                                .map(p => `${p}:${c.style.getPropertyValue(p)}`).join(';');
        if (css) keep.style = css;
        [...c.attributes].forEach(a => c.removeAttribute(a.name));
        Object.entries(keep).forEach(([k, v]) => c.setAttribute(k, v));
        if (tag === 'A') { if (keep.href) { c.target = '_blank'; c.rel = 'noopener noreferrer'; } else c.replaceWith(...c.childNodes); }
      }
    })(doc.body);
    return doc.body.innerHTML;
  }

  // ---------- state ----------
  const blank = () => ({ id: uid(), title: '', html: '', created: Date.now(), modified: Date.now() });
  function normalize(r) {
    if (!r || !Array.isArray(r.sections)) return null;
    const str = (v, n) => typeof v === 'string' ? v.slice(0, n) : '';
    const secs = r.sections.slice(0, 200).map(s => ({
      id: str(s.id, 40) || uid(), name: str(s.name, 80) || 'Section', color: COLORS.includes(s.color) ? s.color : COLORS[0],
      pages: (Array.isArray(s.pages) ? s.pages : []).slice(0, 2000).map(p => ({
        id: str(p.id, 40) || uid(), title: str(p.title, 200), html: clean(str(p.html, 2e6)),
        created: +p.created || Date.now(), modified: +p.modified || Date.now() }))
    }));
    if (!secs.length) return null;
    secs.forEach(s => s.pages.length || s.pages.push(blank()));
    return { v: 2, sections: secs, sec: str(r.sec, 40), page: str(r.page, 40),
             theme: r.theme === 'dark' || r.theme === 'light' ? r.theme : null, ruled: !!r.ruled,
             size: Math.min(32, Math.max(10, +r.size || 16)) };
  }
  const parse = t => { try { return JSON.parse(t); } catch { return null; } };
  function seed() {
    const mk = (title, html) => ({ ...blank(), title, html });
    const a = { id: uid(), name: 'Quick Notes', color: COLORS[0], pages: [mk('Welcome to Pro Note',
      '<h2>Your notebook, your way</h2><p>Sections on the left, pages in the middle, and a free-form canvas here.</p><p><br></p>' +
      '<div class="todo"><input type="checkbox"> Try the <b>To Do</b> tag (Ctrl+1)</div>' +
      '<div class="todo"><input type="checkbox" checked> Create a new page (Ctrl+Alt+N)</div>' +
      '<div class="todo"><input type="checkbox"> Search every note with Ctrl+E</div><p><br></p>' +
      '<p>Notes are stored privately in this browser. Use <b>Backup</b> regularly to keep a copy.</p>')] };
    return { v: 2, sections: [a, { id: uid(), name: 'Personal', color: COLORS[1], pages: [mk('Ideas', '')] },
             { id: uid(), name: 'Work', color: COLORS[2], pages: [mk('Meeting notes', '')] }],
             sec: a.id, page: a.pages[0].id, theme: null, ruled: false, size: 16 };
  }
  function persist(manual) {
    clearTimeout(timer); dirty = false;
    try { localStorage.setItem(KEY, JSON.stringify(S)); $('saved').textContent = 'Saved'; warnedQuota = false; if (manual) toast('Saved'); }
    catch { $('saved').textContent = 'Not saved'; if (!warnedQuota) { warnedQuota = true; toast('Storage is full or blocked. Use Backup to keep a copy of your notes.', { ms: 9000 }); } }
  }
  function later() { dirty = true; $('saved').textContent = 'Saving…'; clearTimeout(timer); timer = setTimeout(() => persist(), 500); }

  const curSec = () => S.sections.find(s => s.id === S.sec);
  const curPage = () => curSec().pages.find(p => p.id === S.page);
  const plain = html => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.replace(/\s+/g, ' ').trim(); };
  const fmtDate = t => new Date(t).toLocaleString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const shortDate = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

  // ---------- dialogs & toasts ----------
  const dlg = $('dlg');
  function ask({ title, message = '', input = null, ok = 'OK', danger = false }) {
    return new Promise(res => {
      $('dTitle').textContent = title; $('dMsg').textContent = message; $('dMsg').hidden = !message;
      const inp = $('dInput'); inp.hidden = input === null; if (input !== null) inp.value = input;
      $('dOk').textContent = ok; $('dOk').className = 'rb ' + (danger ? 'danger' : 'primary');
      dlg.returnValue = '';
      dlg.onclose = () => res(dlg.returnValue === 'ok' ? (input === null ? true : inp.value.trim() || null) : (input === null ? false : null));
      dlg.showModal(); if (input !== null) { inp.focus(); inp.select(); }
    });
  }
  $('dOk').onclick = () => dlg.close('ok');
  $('dCancel').onclick = () => dlg.close('cancel');
  $('dInput').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); dlg.close('ok'); } };
  let toastTimer;
  function toast(msg, { action, onAction, ms = 5000 } = {}) {
    $('tMsg').textContent = msg; const a = $('tAct');
    a.hidden = !action; a.textContent = action || ''; a.onclick = () => { $('toast').classList.remove('show'); onAction && onAction(); };
    $('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), ms);
  }

  // ---------- rendering ----------
  function renderNav() {
    const nav = $('nav'); nav.replaceChildren(h('div', { class: 'nbname' }, '📓 My Notebook'));
    S.sections.forEach(s => {
      const sw = h('button', { class: 'sw', title: 'Change colour', 'aria-label': `Change colour of ${s.name}`,
        onclick: () => { s.color = COLORS[(COLORS.indexOf(s.color) + 1) % COLORS.length]; refreshAll(); persist(); } });
      sw.style.background = s.color;
      const main = h('button', { class: 'main', title: 'Double-click or press F2 to rename',
        onclick: () => openPage(s.id, s.pages[0].id), ondblclick: () => renameSection(s),
        onkeydown: e => e.key === 'F2' && renameSection(s) }, s.name);
      if (s.id === S.sec) main.setAttribute('aria-current', 'true');
      const row = h('div', { class: 'sec' + (s.id === S.sec ? ' active' : '') }, sw, main,
        h('button', { class: 'x', title: 'Delete section', 'aria-label': `Delete section ${s.name}`, onclick: () => delSection(s) }, '✕'));
      nav.append(row);
    });
    nav.append(h('button', { class: 'addbtn', onclick: addSection }, '＋ Add section'));
  }
  function pageRow(s, p, withSec) {
    const main = h('button', { class: 'main', onclick: () => openPage(s.id, p.id) },
      h('div', { class: 't' }, p.title || 'Untitled page'),
      h('div', { class: 'd' }, (withSec ? s.name + ' · ' : '') + shortDate(p.modified) + '  ' + plain(p.html).slice(0, 40)));
    if (p.id === S.page) main.setAttribute('aria-current', 'page');
    const row = h('div', { class: 'pg' + (p.id === S.page ? ' active' : ''), role: 'listitem' }, main,
      h('button', { class: 'x', title: 'Delete page', 'aria-label': `Delete page ${p.title || 'Untitled'}`, onclick: () => delPage(s, p) }, '✕'));
    row.style.setProperty('--sec', s.color); return row;
  }
  function renderPages() {
    const box = $('pages'), q = $('search').value.trim().toLowerCase();
    box.replaceChildren();
    if (q) {
      let n = 0;
      S.sections.forEach(s => s.pages.forEach(p => {
        if ((p.title + ' ' + plain(p.html)).toLowerCase().includes(q)) { box.append(pageRow(s, p, true)); n++; }
      }));
      if (!n) box.append(h('div', { class: 'hint' }, 'No results found.'));
      return;
    }
    curSec().pages.forEach(p => box.append(pageRow(curSec(), p, false)));
    box.append(h('button', { class: 'addbtn', onclick: newPage }, '＋ Add page'));
  }
  function refreshAll() { renderNav(); renderPages(); $('canvas').style.setProperty('--sec', curSec().color); }
  function openPage(secId, pageId, save = true) {
    S.sec = S.sections.some(s => s.id === secId) ? secId : S.sections[0].id;
    const s = curSec(); S.page = s.pages.some(p => p.id === pageId) ? pageId : s.pages[0].id;
    const p = curPage(); ptitle.value = p.title; body.innerHTML = p.html; $('pdate').textContent = fmtDate(p.created);
    refreshAll(); save && persist();
  }

  // ---------- add / rename / delete ----------
  function newPage() { const p = blank(); curSec().pages.push(p); $('search').value = ''; openPage(S.sec, p.id); ptitle.focus(); }
  async function addSection() {
    const n = await ask({ title: 'New section', input: 'New Section', ok: 'Add' }); if (!n) return;
    const s = { id: uid(), name: n.slice(0, 80), color: COLORS[S.sections.length % COLORS.length], pages: [blank()] };
    S.sections.push(s); openPage(s.id, s.pages[0].id);
  }
  async function renameSection(s) {
    const n = await ask({ title: 'Rename section', input: s.name, ok: 'Rename' });
    if (n) { s.name = n.slice(0, 80); refreshAll(); persist(); }
  }
  function delPage(s, p) {
    const i = s.pages.indexOf(p); s.pages.splice(i, 1);
    const wasLast = !s.pages.length; if (wasLast) s.pages.push(blank());
    openPage(s.id, s.pages[Math.min(i, s.pages.length - 1)].id);
    toast('Page deleted', { action: 'Undo', onAction: () => {
      if (!S.sections.includes(s)) return;
      if (wasLast) s.pages.pop(); s.pages.splice(i, 0, p); openPage(s.id, p.id); } });
  }
  async function delSection(s) {
    if (S.sections.length === 1) return toast('A notebook needs at least one section.');
    if (!await ask({ title: 'Delete section?', message: `"${s.name}" and its ${s.pages.length} page(s) will be permanently deleted.`, ok: 'Delete', danger: true })) return;
    S.sections.splice(S.sections.indexOf(s), 1); openPage(S.sections[0].id, S.sections[0].pages[0].id);
  }

  // ---------- editing ----------
  function touch() {
    const p = curPage(); p.title = ptitle.value.slice(0, 200); p.html = body.innerHTML; p.modified = Date.now();
    renderPages(); later();
  }
  ptitle.addEventListener('input', touch);
  ptitle.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); body.focus(); } });
  body.addEventListener('input', touch);
  body.addEventListener('click', e => {
    if (e.target.matches('input[type=checkbox]')) { e.target.toggleAttribute('checked', e.target.checked); touch(); }
    const a = e.target.closest('a'); if (a && (e.ctrlKey || e.metaKey) && safeUrl(a.href)) { e.preventDefault(); window.open(a.href, '_blank', 'noopener,noreferrer'); }
  });
  body.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); });
  body.addEventListener('drop', e => e.preventDefault());
  document.addEventListener('selectionchange', () => {
    const sel = getSelection(); if (sel.rangeCount && body.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0).cloneRange();
  });
  function focusBody() { body.focus(); if (savedRange) { const sel = getSelection(); sel.removeAllRanges(); sel.addRange(savedRange); } }
  function exec(cmd, val) { focusBody(); document.execCommand('styleWithCSS', false, true); document.execCommand(cmd, false, val); touch(); }
  const insertHTML = html => { focusBody(); document.execCommand('insertHTML', false, html); touch(); };
  const insertText = t => { focusBody(); document.execCommand('insertText', false, t); touch(); };
  async function addLink() {
    focusBody(); const hadSel = savedRange && !savedRange.collapsed, saved = savedRange;
    let u = await ask({ title: 'Insert link', input: 'https://', ok: 'Insert' }); if (!u) return;
    if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
    if (!safeUrl(u)) return toast('Only http, https and mailto links are allowed.');
    savedRange = saved;
    hadSel ? exec('createLink', u) : insertHTML(`<a href="${esc(u)}">${esc(u)}</a>&nbsp;`);
  }
  const todoHTML = '<div class="todo"><input type="checkbox">&nbsp;</div>';

  // ---------- import / export / backup ----------
  const download = (name, text, type) => {
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const stamp = () => new Date().toISOString().slice(0, 10);
  $('bExport').onclick = () => {
    const p = curPage();
    download((p.title || 'Untitled page').replace(/[\\/:*?"<>|]/g, '_') + '.html',
      `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(p.title)}</title></head><body><h1>${esc(p.title)}</h1>${p.html}</body></html>`, 'text/html');
  };
  $('bBackup').onclick = () => { persist(); download(`pronote-backup-${stamp()}.json`, JSON.stringify(S, null, 2), 'application/json'); toast('Backup downloaded'); };
  $('bRestore').onclick = () => $('rfile').click();
  $('rfile').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (f.size > 50 * 1024 * 1024) return toast('Backup file is too large.');
    const r = new FileReader();
    r.onload = async () => {
      const n = normalize(parse(String(r.result)));
      if (!n) return toast('That file is not a valid Pro Note backup.');
      if (!await ask({ title: 'Restore backup?', message: 'This replaces all current notes in this browser.', ok: 'Restore', danger: true })) return;
      S = n; applyView(); openPage(S.sec, S.page); toast('Backup restored');
    };
    r.readAsText(f);
  });
  $('bImport').onclick = () => $('file').click();
  $('file').addEventListener('change', e => {
    [...e.target.files].forEach(f => {
      if (f.size > MAX_IMPORT) return toast(`"${f.name}" is larger than 2 MB.`);
      const r = new FileReader();
      r.onload = () => {
        const raw = String(r.result);
        const html = /\.html?$/i.test(f.name) ? clean(raw) : raw.split('\n').map(l => `<p>${esc(l) || '<br>'}</p>`).join('');
        const p = { ...blank(), title: f.name.replace(/\.\w+$/, '').slice(0, 200), html }; curSec().pages.push(p); openPage(S.sec, p.id);
      };
      r.onerror = () => toast(`Could not read "${f.name}".`);
      r.readAsText(f);
    });
    e.target.value = '';
  });

  // ---------- ribbon / view ----------
  document.querySelectorAll('[data-cmd]').forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => exec(b.dataset.cmd); });
  $('bNewPage').onclick = newPage;
  $('bHi').onmousedown = e => e.preventDefault(); $('bHi').onclick = () => exec('hiliteColor', '#fff176');
  $('fcolor').oninput = e => exec('foreColor', e.target.value);
  $('style').onchange = e => exec('formatBlock', e.target.value);
  $('size').onchange = e => exec('fontSize', e.target.value);
  $('tTodo').onclick = () => insertHTML(todoHTML);
  $('tImp').onclick = () => insertText('⭐ '); $('tQ').onclick = () => insertText('❓ ');
  $('iTable').onclick = () => insertHTML('<table>' + '<tr><td><br></td><td><br></td><td><br></td></tr>'.repeat(3) + '</table><p><br></p>');
  $('iLink').onclick = addLink; $('iDate').onclick = () => insertText(new Date().toLocaleString());
  $('iHr').onclick = () => exec('insertHorizontalRule'); $('bPrint').onclick = () => window.print();
  function applyView() {
    const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'; $('vTheme').textContent = dark ? 'Light' : 'Dark';
    document.body.classList.toggle('ruled', S.ruled); $('vRule').setAttribute('aria-pressed', S.ruled);
    body.style.setProperty('--fs', S.size + 'px');
  }
  $('vTheme').onclick = () => { S.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyView(); persist(); };
  $('vRule').onclick = () => { S.ruled = !S.ruled; applyView(); persist(); };
  $('zIn').onclick = () => { S.size = Math.min(32, S.size + 2); applyView(); persist(); };
  $('zOut').onclick = () => { S.size = Math.max(10, S.size - 2); applyView(); persist(); };
  $('search').addEventListener('input', renderPages);
  $('search').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; renderPages(); body.focus(); } });

  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return; const k = e.key.toLowerCase();
    if (k === 'e' || (k === 'f' && !e.altKey)) { e.preventDefault(); $('search').focus(); $('search').select(); }
    else if (e.altKey && k === 'n') { e.preventDefault(); newPage(); }
    else if (k === 's') { e.preventDefault(); persist(true); }
    else if (k === 'k') { e.preventDefault(); addLink(); }
    else if (k === '1') { e.preventDefault(); insertHTML(todoHTML); }
  });

  // ---------- reliability ----------
  const flush = () => { if (dirty) persist(); };
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => document.hidden && flush());
  addEventListener('storage', e => {            // keep other open tabs in sync
    if (e.key !== KEY || document.hasFocus()) return;
    const n = normalize(parse(e.newValue)); if (!n) return;
    S = n; applyView(); openPage(S.sec, S.page, false); toast('Notes updated from another tab');
  });
  addEventListener('error', () => toast('Something went wrong. Your notes are safe; try reloading the page.'));
  addEventListener('unhandledrejection', () => toast('Something went wrong. Your notes are safe; try reloading the page.'));

  // ---------- init ----------
  let raw = null; try { raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY); } catch {}
  S = normalize(parse(raw)) || seed();
  applyView(); openPage(S.sec, S.page);
})();
</script>
</body>
</html>
